[project]
name = "sungrid-copilot"
version = "0.1.0"
description = "SunGrid Cooperative Copilot - RAG + agent over 14 KB docs"
requires-python = ">=3.11,<4.0"
dependencies = [
    "qdrant-client>=1.9.0,<1.11.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-ai-slim[openrouter]>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.sdist]
include = ["pyproject.toml", "README.md", "stub_tools.py", "src/sungrid"]

exclude = ["*.pyc", "__pycache__", ".venv", "qdrant_storage"]

[tool.hatch.build.targets.wheel]
packages = ["src/sungrid"]
